<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo Vanilla JS: Añadir Palabras</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-md bg-white rounded-xl shadow-md p-6 space-y-6">
        <header>
            <h1 class="text-xl font-bold text-slate-800">Ejemplo Vanilla JS: Añadir Palabras</h1>
        </header>

        <!-- Form -->
        <div class="flex gap-2">
            <input type="text" name="word" placeholder="Escribe una palabra..."
                class="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button type="button" data-action="add-word"
                class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors">
                Añadir palabra
            </button>
        </div>

        <!-- Words container -->
        <div data-ref="words-container" class="flex flex-wrap gap-2 p-2 border border-dashed border-slate-400 rounded-lg"></div>
        <template data-ref="word-template">
            <div class="flex items-center justify-between p-2 bg-white rounded shadow-sm">
                <span class="text-sm text-gray-800"></span>
                <button type="button"
                    class="text-red-600 hover:text-red-800 text-sm font-bold px-2"
                    aria-label="Eliminar de la lista"
                    data-action="delete-word">
                    ×
                </button>
            </div>
        </template>
    </main>

    <script>
        const addButton = document.querySelector('button[data-action="add-word"]');
        const template = document.querySelector('template[data-ref="word-template"]');
        const wordInput = document.querySelector('input[name="word"]');
        const wordsContainer = document.querySelector('div[data-ref="words-container"]');

        // Handle the button click event
        addButton.addEventListener('click', function () {
            const word = wordInput.value.trim();
            if (word === '') {
                alert('No has introducido una palabra');
                return;
            }
            wordInput.value = ''; // Clean the input

            addWordToList(word);
        });

        // Use event delegation to remove words from the container
        wordsContainer.addEventListener('click', (event) => {
            const deleteButton = event.target.closest('[data-action="delete-word"]');
            if (!deleteButton) {
                return;
            }

            const wordItem = deleteButton.closest('div.flex');
            if (wordItem) {
                wordItem.remove();
            }
        });

        // Create the word HTML element and add to the words list container
        // I will to use Tailwind classes to style the elements
        function addWordToList(word) // void
        {
            const item = template.content.cloneNode(true);
            item.querySelector('span').textContent = word;

            wordsContainer.append(item);
        }
    </script>
</body>

</html>
